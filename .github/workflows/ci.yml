name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualite:
    name: Lint, types, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installation
        run: npm ci

      - name: Formatage (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Tests de parcours (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: qualite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installation
        run: npm ci

      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests de parcours
        run: npm run test:e2e

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
